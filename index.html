<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Adaptive Garage</title>
    <!-- Google Fonts: Bebas Neue & Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-black: #000000;
            --surface-charcoal: #121212;
            --border-gray: #262626;
            --text-white: #FFFFFF;
            --text-gray: #A3A3A3;
            --adaptive-orange: #FF6A13;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-black);
            color: var(--text-white);
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            overflow-x: hidden;
        }

        h1 {
            font-family: 'Bebas Neue', sans-serif;
            letter-spacing: 1.5px;
            text-transform: uppercase;
        }

        .highlight-orange {
            color: var(--adaptive-orange);
        }

        /* Banner Header */
        header {
            width: 100%;
            border-bottom: 1px solid var(--border-gray);
            background-color: var(--bg-black);
        }

        .banner-img {
            width: 100%;
            max-width: 1374px;
            height: auto;
            margin: 0 auto;
            display: block;
        }

        /* Main Placeholder Content */
        .hero {
            max-width: 720px;
            margin: auto;
            padding: 80px 24px;
            text-align: center;
        }

        h1 {
            font-size: clamp(48px, 8vw, 76px);
            line-height: 1.05;
        }

        /* Footer */
        footer {
            padding: 32px;
            border-top: 1px solid var(--border-gray);
            text-align: center;
            font-size: 13px;
            color: var(--text-gray);
            display: flex;
            flex-direction: column;
            gap: 8px;
            align-items: center;
        }

        .social-links {
            display: flex;
            gap: 20px;
        }

        .social-links a {
            color: var(--text-white);
            text-decoration: none;
            font-size: 14px;
            letter-spacing: 1px;
            transition: color 0.2s;
        }

        .social-links a:hover {
            color: var(--adaptive-orange);
        }
    </style>
</head>
<body>

    <!-- Banner Header -->
    <header>
        <img src="banner.jpg" alt="Adaptive Garage Banner" class="banner-img">
    </header>

    <!-- Main Content -->
    <main class="hero">
        <h1>NOT JUNK.<br>JUST <span class="highlight-orange">NOT</span> FINISHED.</h1>
    </main>

    <!-- Footer -->
    <footer>
        <div class="social-links">
            <a href="https://youtube.com/@adaptivegarage" target="_blank" rel="noopener noreferrer">YouTube</a>
        </div>
        <div>&copy; 2026 Adaptive Garage (adaptivegarage.com.au). All Rights Reserved.</div>
    </footer>

</body>
</html>
